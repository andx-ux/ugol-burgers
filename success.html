<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Оплата прошла — УГОЛЬ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .result-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .result-card{max-width:480px;}
  .result-icon{
    width:64px;height:64px;border-radius:50%;background:var(--pickle);
    display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
    color:var(--char);font-size:2rem;
  }
  .result-card h1{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:16px;}
  .result-card p{color:var(--paper-dim);font-size:1rem;margin-bottom:32px;line-height:1.6;}
</style>
</head>
<body>
<div class="result-wrap">
  <div class="result-card">
    <div class="result-icon">✓</div>
    <h1>Оплата прошла успешно</h1>
    <p>Спасибо за заказ! Мы уже получили уведомление и начинаем готовить. Если что-то понадобится уточнить — позвоним по указанному телефону.</p>
    <a href="index.html" class="btn btn-primary">Вернуться на сайт</a>
  </div>
</div>
<script>
  try{ localStorage.removeItem('ugol_cart_v1'); } catch(e){}
</script>
</body>
</html>
